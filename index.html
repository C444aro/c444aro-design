<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio — Carolina Romero (c444aro)</title>
<meta name="description" content="Portada del portafolio de Carolina Romero (c444aro), diseñadora gráfica con profundización en diseño y estrategia de marca. Haz clic para entrar al CV.">
<link rel="icon" href="assets/img/icon-c444aro.png" type="image/png">
<style>
/* Sistema c444aro (tokens de DESIGN.md) aplicado a la portada */
:root{
  --primary:#0081C5; --secondary:#E80029; --tertiary:#FFC600;
  --neutral:#F9DFB7; --ink:#0B1F3A; --white:#FFFFFF; --canvas:#FCF4E8;
  --rounded-sm:8px; --rounded-md:12px; --rounded-full:9999px;
  --xs:4px; --sm:8px; --md:16px; --lg:24px; --xl:32px; --container:1200px;
  --font-display:"Mr Eaves Sans OT","Avenir",system-ui,sans-serif;
  --font-body:"Avenir",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-accent:"Borel","Avenir",system-ui,sans-serif;
}
@font-face{font-family:"Mr Eaves Sans OT";src:url("tipografias/woff/MrEavesXLModOT-Heavy.woff") format("woff");font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:"Mr Eaves Sans OT";src:url("tipografias/woff/MrEavesXLModOT-Ultra.woff") format("woff");font-weight:950;font-style:normal;font-display:swap}
@font-face{font-family:"Avenir";src:url("tipografias/woff/Avenir-Book.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Avenir";src:url("tipografias/woff/Avenir-Medium.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Avenir";src:url("tipografias/woff/Avenir-Black.woff") format("woff");font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:"Borel";src:url("tipografias/woff/Borel-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
*{box-sizing:border-box}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.6}
/* Portada de pantalla completa: toda la superficie es un enlace que entra al CV */
.portada{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--lg);
  min-height:100vh;min-height:100svh;padding:var(--xl) var(--lg);text-align:center;text-decoration:none;color:inherit;overflow:hidden}
/* Círculos decorativos de la marca (mandala simplificado) */
.portada::before,.portada::after{content:"";position:absolute;border-radius:var(--rounded-full);opacity:.18;pointer-events:none}
.portada::before{width:clamp(240px,44vw,560px);aspect-ratio:1;background:var(--primary);left:-12%;bottom:-14%}
.portada::after{width:clamp(200px,36vw,460px);aspect-ratio:1;background:var(--tertiary);right:-10%;top:-12%}
.portada-icono{position:relative;width:clamp(72px,10vw,120px);height:auto;image-rendering:pixelated;transition:transform .3s ease}
.portada-kicker{position:relative;font-family:var(--font-accent);font-size:clamp(15px,2.2vw,20px);margin:0;-webkit-text-stroke:.4px currentColor}
.portada-titulo{position:relative;font-family:var(--font-display);font-weight:950;font-size:clamp(60px,17vw,190px);line-height:.95;
  letter-spacing:-.02em;margin:0;color:var(--ink);
  text-shadow:6px 6px 0 var(--primary),12px 12px 0 var(--secondary),18px 18px 0 var(--tertiary);
  transition:transform .3s ease,text-shadow .3s ease}
.portada-hint{position:relative;margin:var(--md) 0 0;font-family:var(--font-accent);font-size:clamp(14px,2vw,18px);color:var(--primary);-webkit-text-stroke:.4px currentColor}
.portada:hover .portada-titulo,.portada:focus-visible .portada-titulo{transform:translate(-3px,-3px);
  text-shadow:9px 9px 0 var(--primary),18px 18px 0 var(--secondary),27px 27px 0 var(--tertiary)}
.portada:hover .portada-icono,.portada:focus-visible .portada-icono{transform:rotate(-6deg)}
:focus-visible{outline:3px solid var(--secondary);outline-offset:4px;border-radius:6px}
/* Al hacer clic, la pantalla se acerca (zoom) y luego abre el CV */
html.saliendo .portada{transform:scale(1.35);opacity:0;transition:transform .42s cubic-bezier(.22,.61,.36,1),opacity .42s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body{animation:pageIn .5s cubic-bezier(.22,.61,.36,1) both}
@media(prefers-reduced-motion:reduce){
  body{animation:none}
  .portada-icono,.portada-titulo{transition:none}
  html.saliendo .portada{transform:none;opacity:1;transition:none}
}
</style>
</head>
<body>
<a class="portada" href="cv.html" aria-label="Entrar al CV de Carolina Romero">
  <img class="portada-icono" src="assets/img/icon-c444aro.png" alt="" aria-hidden="true" width="120" height="120" fetchpriority="high">
  <p class="portada-kicker">Carolina Romero · Diseño y Estrategia de Marca</p>
  <h1 class="portada-titulo">Portafolio</h1>
  <p class="portada-hint">Haz clic en cualquier parte para entrar</p>
</a>
<script>
/* La portada siempre abre desde arriba (evita que el navegador recuerde otra sección) */
if('scrollRestoration' in history){history.scrollRestoration='manual';}
window.addEventListener('load',function(){window.scrollTo(0,0);});
window.addEventListener('pageshow',function(e){if(e.persisted){window.scrollTo(0,0);}});
/* Zoom suave antes de entrar al CV */
(function(){
  var a=document.querySelector('.portada');
  if(!a) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  a.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
    e.preventDefault();
    document.documentElement.classList.add('saliendo');
    setTimeout(function(){location.href='cv.html';},420);
  });
})();
</script>
<script src="cursor.js"></script>
</body>
</html>
